<style>
:root{--tiffany:#81D8D0;--tiffany-soft:#DFF5F2;--lagoon:#0B7C78;--ink:#0C3338;--ink-soft:#4A6A6E;--paper:#fff;--paper-2:#F3FBFA;--line:#CFE3E2;--hot-pink:#FF2E93;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;--body:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper-2);color:var(--ink)}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));font:300 1.05rem/1.55 var(--body);
  background:radial-gradient(120% 80% at 50% 0%,var(--tiffany-soft) 0%,var(--paper-2) 55%,#fff 100%)}
.card{width:100%;max-width:420px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:2.6rem 1.6rem 2.2rem;box-shadow:0 18px 50px rgba(8,60,64,.10)}
.mono{font:400 2.4rem/1 var(--display);letter-spacing:.02em;margin:0 0 .4rem}
.mono b{font-style:italic;font-weight:400;color:var(--lagoon);padding:0 .12em}
h1{font:400 1.7rem/1.2 var(--display);margin:.2rem 0 .5rem}
p{margin:0 0 1.5rem;color:var(--ink-soft)}
form{display:flex;flex-direction:column;gap:.75rem}
input{width:100%;min-height:50px;padding:.7rem 1rem;border:1px solid var(--line);border-radius:999px;font:400 1.05rem var(--body);color:var(--ink);background:#fff;text-align:center;outline:none}
input:focus{border-color:var(--tiffany);box-shadow:0 0 0 4px var(--tiffany-soft)}
button{min-height:50px;border:0;border-radius:999px;background:var(--tiffany);color:var(--ink);font:500 1rem var(--body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 2px 8px rgba(8,60,64,.14)}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:1.5em;margin:.9rem 0 0;font-size:.95rem;color:var(--ink-soft)}
.msg.err{color:#c4166f}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

    document.body.innerHTML = doc.body.innerHTML;
    Array.prototype.forEach.call(doc.body.attributes, function(a){ document.body.setAttribute(a.name, a.value); });
    var old = document.querySelectorAll('script');
    for (var i = 0; i < old.length; i++) {
      var s = document.createElement('script');
      Array.prototype.forEach.call(old[i].attributes, function(a){ s.setAttribute(a.name, a.value); });
      s.text = old[i].text;
      old[i].parentNode.replaceChild(s, old[i]);
    }
    try { document.dispatchEvent(new Event('DOMContentLoaded')); window.dispatchEvent(new Event('load')); } catch (e) {}
  }

  function open(pass){
    var c = window.crypto && (crypto.subtle || crypto.webkitSubtle);
    if (!c || !window.TextEncoder) return Promise.reject(fail('nocrypto'));
    var p = norm(pass);
    return Promise.resolve()
      .then(function(){ return c.importKey('raw', new TextEncoder().encode(p), { name: 'PBKDF2' }, false, ['deriveKey']); })
      .then(function(base){ return c.deriveKey({ name: 'PBKDF2', salt: un64(LOCK.salt), iterations: LOCK.iter, hash: { name: 'SHA-256' } }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .catch(function(err){ throw fail('nocrypto', err); })
      .then(function(key){
        return c.decrypt({ name: 'AES-GCM', iv: un64(LOCK.iv) }, key, un64(LOCK.data))
          .catch(function(err){ throw fail(err && err.name === 'OperationError' ? 'wrong' : 'nocrypto', err); });
      })
      .then(function(buf){
        try { localStorage.setItem(KEY, p); } catch (e) {}
        var html = new TextDecoder().decode(buf), hash = location.hash;
        try { show(html); } catch (err) { throw fail('show', err); }
        if (hash) setTimeout(function(){ var t = document.getElementById(hash.slice(1)); if (t) t.scrollIntoView(); }, 60);
      });
  }

  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    open(saved).catch(function(){ try { localStorage.removeItem(KEY); } catch (e) {} card.hidden = false; });
  } else { card.hidden = false; pw.focus(); }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    if (!norm(pw.value)) return;
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Opening…';
    open(pw.value).catch(function(err){
      go.disabled = false;
      msg.className = 'msg err';
      var kind = err && err.message;
      msg.textContent = kind === 'wrong'
        ? 'That’s not quite it. Please try again.'
        : 'Sorry, the site couldn’t open in this browser. (' + (kind || 'error') + (err && err.detail ? ', ' + err.detail : '') + ')';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      pw.select();
    });
  });
})();
</script>
